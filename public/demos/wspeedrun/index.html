<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WSpeedrun API Docs</title>
    <!--
      Dokumentasi API WSpeedrun Microservices (Swagger UI) untuk "Try It Live" di portofolio.
      auth.json / game.json / run.json dibuat dari kode NestJS (SwaggerModule.createDocument) tiap service.
      Hanya dokumentasi: service tidak di-hosting, jadi tombol "Try it out" dimatikan.
    -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css" />
    <style>
      body {
        margin: 0;
        background: #fff;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 16px;
        padding: 12px 16px;
        background: #0f172a;
        color: #e2e8f0;
      }
      .bar strong {
        font-size: 15px;
      }
      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .tabs button {
        padding: 6px 12px;
        border: 1px solid #334155;
        border-radius: 999px;
        background: transparent;
        color: #cbd5e1;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      .tabs button.on {
        background: #22d3ee;
        border-color: #22d3ee;
        color: #0f172a;
        font-weight: 600;
      }
      .note {
        margin: 0;
        padding: 10px 16px;
        background: #f1f5f9;
        color: #334155;
        font-size: 13px;
        border-bottom: 1px solid #e2e8f0;
      }
      .note code {
        background: #e2e8f0;
        padding: 1px 5px;
        border-radius: 4px;
      }
      .swagger-ui .topbar {
        display: none;
      }
      .swagger-ui .info {
        margin: 24px 0 12px;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <strong>⏱️ WSpeedrun Microservices</strong>
      <div class="tabs" role="tablist">
        <button data-spec="auth" data-port="3000" class="on">Auth Service</button>
        <button data-spec="game" data-port="3001">Game Service</button>
        <button data-spec="run" data-port="3002">Run Service</button>
      </div>
    </div>
    <p class="note">
      API docs generated from the NestJS code of each service. Docs only: the services are not hosted, so requests
      can't be sent from here. Run it locally (see the README) and open <code id="local">http://localhost:3000/api</code>
      to try the endpoints.
    </p>
    <div id="swagger"></div>

    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
    <script>
      const local = document.getElementById('local');
      function show(spec, port) {
        SwaggerUIBundle({
          url: `${spec}.json`,
          dom_id: '#swagger',
          docExpansion: 'list',
          defaultModelsExpandDepth: 0,
          supportedSubmitMethods: [], // tanpa "Try it out": tidak ada server yang menjawab
          deepLinking: false,
        });
        local.textContent = `http://localhost:${port}/api`;
      }
      document.querySelectorAll('.tabs button').forEach((b) =>
        b.addEventListener('click', () => {
          document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === b));
          show(b.dataset.spec, b.dataset.port);
        }),
      );
      show('auth', 3000);
    </script>
  </body>
</html>
